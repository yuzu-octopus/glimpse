<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2327" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/JetBrainsMono-Regular.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/JetBrainsMono-SemiBold.woff2"
    />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('glimpse.paint.v1') || 'null');
        if (s && s.scheme && s.bg && s.fg) {
          document.documentElement.style.colorScheme = s.scheme;
          document.documentElement.style.backgroundColor = s.bg;
          document.documentElement.style.color = s.fg;
        }
      } catch (e) {}
    </script>
    <title>Glimpse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
