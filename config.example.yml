# Glimpse — curated demo (4 pages, hide-headers, Singapore).
# Tiling: Home/Dev/Lab = columns (small stays 300px), Social = collage bento (340px).
# New widgets: server-stats / dns-stats / docker-containers (all homelab, on Lab).
pages:
  - name: Home
    slug: home
    hide-headers: true
    head-widgets:
      - type: search
        placeholder: Search the web or jump with a bang…
        search-engine:
          name: DuckDuckGo
          url: https://duckduckgo.com/?q={QUERY}
        bangs:
          - title: GitHub
            shortcut: gh
            url: https://github.com/search?q={QUERY}
          - title: Wikipedia
            shortcut: wiki
            url: https://en.wikipedia.org/wiki/Special:Search?search={QUERY}
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Singapore
                label: Singapore
              - timezone: America/New_York
                label: New York
              - timezone: America/Los_Angeles
                label: California
          - type: weather
            location: Singapore
            units: metric
          - type: calendar
            first-day-of-week: monday
          - type: todo
            id: home-todo
      - size: full
        widgets:
          - type: rss
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
              - url: https://lobste.rs/rss
                title: Lobsters
          - type: monitor
            sites:
              - url: https://github.com
                title: GitHub
              - url: https://duckduckgo.com
                title: DuckDuckGo
              - url: https://example.com
                title: example.com
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
      - size: small
        widgets:
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: EURUSD=X
                name: EUR/USD
          - type: bookmarks
            groups:
              - title: Quick links
                links:
                  - title: GitHub
                    url: https://github.com
                  - title: selfh.st
                    url: https://selfh.st
                  - title: Hacker News
                    url: https://news.ycombinator.com
                  - title: Glance
                    url: https://github.com/glanceapp/glance
              - title: Tools
                links:
                  - title: DuckDuckGo
                    url: https://duckduckgo.com
                  - title: Notion
                    url: https://notion.so

  - name: Dev
    slug: dev
    hide-headers: true
    columns:
      - size: full
        widgets:
          - type: split-column
            widgets:
              - type: releases
                repositories:
                  - glanceapp/glance
                  - sharkdp/bat
                  - BurntSushi/ripgrep
                show-source-icon: true
                limit: 10
              - type: repository
                repository: glanceapp/glance
                pull-requests-limit: 5
                issues-limit: 5
          - type: videos
            title: Tech — recent
            limit: 9
            style: grid-cards
            channels:
              - "@Fireship"
              - "@ByCloud"
              - "@BetterStack"
              - "@Bug-I"
              - "@CalebWritesCode"
              - "@AZisk"
      - size: small
        widgets:
          - type: custom-api
            url: https://api.github.com/repos/glanceapp/glance
            options:
              path: $.stargazers_count
              title: Stargazers
              description: github.com/glanceapp/glance
          - type: markets
            markets:
              - symbol: AAPL
                name: Apple
              - symbol: NVDA
                name: NVIDIA
              - symbol: TSLA
                name: Tesla
              - symbol: MSFT
                name: Microsoft
          - type: weather
            location: Singapore
            units: metric
          - type: group
            widgets:
              - type: todo
                id: dev-todo
              - type: iframe
                source: https://example.com
                height: 360

  - name: Social
    slug: social
    hide-headers: true
    tiling: collage
    min-column-width: 340
    columns:
      - size: full
        widgets:
          - type: videos
            title: Tech creators
            limit: 6
            style: vertical-list
            channels:
              - "@Fireship"
              - "@ByCloud"
              - "@BetterStack"
          - type: reddit
            subreddit: selfhosted
            limit: 8
            collapse-after: 5
            show-thumbnails: true
            show-flairs: true
            source-header: true
      - size: full
        widgets:
          - type: videos
            title: Minecraft
            limit: 3
            style: grid-cards
            channels:
              - UCGwHHBGD-1ysDvq1Z4xXw7g
              - UCPLMPHT-d8GZOqL_AHJFdQQ
              - UCkzzNLnuM-VsATWC53ehwOQ
              - "@SpokeIsHere"
          - type: bookmarks
            groups:
              - title: Social
                links:
                  - title: Reddit
                    url: https://reddit.com
                  - title: Lobsters
                    url: https://lobste.rs
                  - title: Twitch
                    url: https://twitch.tv
          - type: todo
            id: social-todo
  - name: Lab
    slug: lab
    hide-headers: true
    # Homelab showcase — columns so small stays 300px, full is the main stage.
    # New homelab widgets (server-stats / dns-stats / docker-containers) live here.
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: server-stats
            title: Servers
            servers:
              - type: local
                name: Glimpse
          - type: dns-stats
            title: Pi-hole
            service: pihole
            url: http://pihole.lab
            hide-graph: false
            hide-top-domains: false
          - type: docker-containers
            title: Containers
            sock-path: /var/run/docker.sock
            running-only: true
            hide-by-default: false
          - type: todo
            id: lab-todo
          - type: weather
            location: Singapore
            units: metric
          - type: bookmarks
            groups:
              - title: Homelab
                links:
                  - title: Grafana
                    url: https://grafana.lab
                    icon: si:grafana
                  - title: Immich
                    url: https://immich.lab
                    icon: si:immich
                  - title: Home Assistant
                    url: https://home.lab
                    icon: si:homeassistant
                  - title: Jellyfin
                    url: https://jellyfin.lab
                    icon: si:jellyfin
                  - title: Pi-hole
                    url: https://pihole.lab
                    icon: si:pihole
              - title: Infra
                links:
                  - title: Proxmox
                    url: https://proxmox.lab
                  - title: Portainer
                    url: https://portainer.lab
                  - title: TrueNAS
                    url: https://truenas.lab
                  - title: Authentik
                    url: https://auth.lab
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: ETH-USD
                name: Ethereum
              - symbol: NVDA
                name: NVIDIA
      - size: full
        widgets:
          - type: monitor
            title: Homelab — health
            sites:
              - url: https://grafana.lab
                title: Grafana
              - url: https://immich.lab
                title: Immich
              - url: https://jellyfin.lab
                title: Jellyfin
              - url: https://home.lab
                title: Home Assistant
              - url: https://pihole.lab
                title: Pi-hole
              - url: https://portainer.lab
                title: Portainer
              - url: https://proxmox.lab
                title: Proxmox
              - url: https://truenas.lab
                title: TrueNAS
              - url: https://auth.lab
                title: Authentik
              - url: https://code.lab
                title: Gitea
          - type: rss
            title: Self-hosted blogs
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://blog.immich.app/rss.xml
                title: Immich
              - url: https://jellyfin.org/posts/rss.xml
                title: Jellyfin
              - url: https://www.home-assistant.io/atom.xml
                title: Home Assistant
              - url: https://blog.cloudflare.com/rss/
                title: Cloudflare Blog
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
          - type: reddit
            subreddit: homelab
            limit: 8
            collapse-after: 5
            show-thumbnails: true
            source-header: true
      - size: small
        widgets:
          - type: videos
            title: Homelab — recent
            limit: 8
            style: grid-cards
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw
              - UCR-DXc1voovS8nhAvccRZhg
              - UCsBjURrPoezykLs9EqgamOA
          - type: releases
            title: Homelab releases
            repositories:
              - immich-app/immich
              - home-assistant/core
              - jellyfin/jellyfin
              - grafana/grafana
            show-source-icon: true
            limit: 8
            collapse-after: 5
          - type: repository
            repository: home-assistant/core
            pull-requests-limit: 5
            issues-limit: 5
          - type: iframe
            title: Grafana
            source: https://grafana.lab/d/000000001/homelab?orgId=1&kiosk
            height: 420
