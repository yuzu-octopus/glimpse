# Glimpse — pure bento (flat widgets, compositor arranges, no manual columns).
# Each widget has `priority` (0-10, higher = top-left) and `zone` (main|sidebar) for rough control.
# Spans are cols on 12-col grid; rows derive from preferred sizes (e.g. rss rows 2 = 2*grid-row-height).
pages:
  - name: Home
    slug: home
    hide-headers: true
    tiling: collage
    grid-columns: 12
    grid-row-height: 96
    head-widgets:
      - type: search
        placeholder: Search the web or jump with a bang…
        search-engine:
          name: DuckDuckGo
          url: https://duckduckgo.com/?q={QUERY}
        bangs:
          - title: GitHub
            shortcut: gh
            url: https://github.com/search?q={QUERY}
          - title: Wikipedia
            shortcut: wiki
            url: https://en.wikipedia.org/wiki/Special:Search?search={QUERY}
    widgets:
      - type: clock
        priority: 9
        zone: sidebar
        span: 3
        hour-format: 24h
        timezones:
          - timezone: Asia/Singapore
            label: Singapore
          - timezone: America/New_York
            label: New York
          - timezone: America/Los_Angeles
            label: California
      - type: weather
        priority: 8
        zone: sidebar
        span: 3
        location: Singapore
        units: metric
      - type: calendar
        priority: 7
        zone: sidebar
        span: 3
        first-day-of-week: monday
      - type: todo
        priority: 5
        zone: sidebar
        span: 3
        id: home-todo
      - type: rss
        priority: 10
        span: 4
        limit: 10
        collapse-after: 5
        source-header: true
        feeds:
          - url: https://selfh.st/rss/
            title: selfh.st
          - url: https://www.theverge.com/rss/index.xml
            title: The Verge
          - url: https://lobste.rs/rss
            title: Lobsters
      - type: monitor
        priority: 6
        span: 4
        sites:
          - url: https://github.com
            title: GitHub
          - url: https://duckduckgo.com
            title: DuckDuckGo
          - url: https://example.com
            title: example.com
      - type: hacker-news
        priority: 9
        span: 4
        limit: 8
        sort-by: top
        collapse-after: 5
        source-header: true
      - type: markets
        priority: 4
        zone: sidebar
        span: 2
        markets:
          - symbol: SPY
            name: S&P 500
          - symbol: BTC-USD
            name: Bitcoin
          - symbol: EURUSD=X
            name: EUR/USD
      - type: bookmarks
        priority: 3
        zone: sidebar
        span: 3
        groups:
          - title: Quick links
            links:
              - title: GitHub
                url: https://github.com
              - title: selfh.st
                url: https://selfh.st
              - title: Hacker News
                url: https://news.ycombinator.com
              - title: Glance
                url: https://github.com/glanceapp/glance
          - title: Tools
            links:
              - title: DuckDuckGo
                url: https://duckduckgo.com
              - title: Notion
                url: https://notion.so

  - name: Dev
    slug: dev
    hide-headers: true
    tiling: collage
    grid-columns: 12
    grid-row-height: 96
    widgets:
      - type: releases
        priority: 9
        span: 6
        repositories:
          - glanceapp/glance
          - sharkdp/bat
          - BurntSushi/ripgrep
        show-source-icon: true
        limit: 10
      - type: videos
        priority: 8
        span: 6
        title: Tech — recent
        limit: 9
        style: grid-cards
        channels:
          - UCsBjURrPoezykLs9EqgamOA
          - "@ByCloud"
          - "@BetterStack"
          - "@Bug-I"
          - "@CalebWritesCode"
          - "@AZisk"
          - UCkQS_dP6GJTmYnMlox-YiKQ
          - "@Fireship"
          - "@SpokeIsHere"
      - type: repository
        priority: 7
        span: 4
        repository: glanceapp/glance
        pull-requests-limit: 5
        issues-limit: 5
      - type: custom-api
        priority: 5
        zone: sidebar
        span: 3
        url: https://api.github.com/repos/glanceapp/glance
        options:
          path: $.stargazers_count
          title: Stargazers
          description: github.com/glanceapp/glance
      - type: markets
        priority: 4
        zone: sidebar
        span: 3
        markets:
          - symbol: AAPL
            name: Apple
          - symbol: NVDA
            name: NVIDIA
          - symbol: TSLA
            name: Tesla
          - symbol: MSFT
            name: Microsoft
      - type: weather
        priority: 3
        zone: sidebar
        span: 3
        location: Singapore
        units: metric
      - type: todo
        priority: 2
        zone: sidebar
        span: 3
        id: dev-todo
      - type: iframe
        priority: 2
        zone: sidebar
        span: 3
        source: https://example.com
        height: 360

  - name: Social
    slug: social
    hide-headers: true
    tiling: collage
    grid-columns: 12
    grid-row-height: 96
    min-column-width: 340
    widgets:
      - type: videos
        priority: 8
        span: 6
        title: Tech creators
        limit: 6
        style: vertical-list
        channels:
          - UCsBjURrPoezykLs9EqgamOA
          - "@ByCloud"
          - "@BetterStack"
      - type: videos
        priority: 8
        span: 6
        title: Minecraft — Unstable Universe & friends
        limit: 3
        style: grid-cards
        channels:
          - UCGwHHBGD-1ysDvq1Z4xXw7g
          - UCPLMPHT-d8GZOqL_AHJFdQQ
          - UCkzzNLnuM-VsATWC53ehwOQ
          - "@SpokeIsHere"
      - type: reddit
        priority: 7
        zone: sidebar
        span: 3
        subreddit: selfhosted
        limit: 8
        collapse-after: 5
        show-thumbnails: true
        show-flairs: true
        source-header: true
      - type: bookmarks
        priority: 5
        zone: sidebar
        span: 3
        groups:
          - title: Social
            links:
              - title: Reddit
                url: https://reddit.com
              - title: Lobsters
                url: https://lobste.rs
