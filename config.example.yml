# Glimpse — curated demo (5 pages, hide-headers, Singapore).
# Tiling: Home/Dev/Lab/Media = columns (12-col spans), Social = collage (place()-driven bento).
# Columns are balanced so every column on a page ends near the same height —
# a short column next to a tall one reads as a broken page, not a sparse one.
# New widgets: server-stats / dns-stats / docker-containers (all homelab, on
# Lab) and the media stack immich / jellyfin / qbittorrent / transmission (Media).
#
# Theme: astryx-dracula, dark only — there is no `theme:` block, and a config
# that still has one fails to load with a message saying so. To append your
# own CSS on top of the brand theme, name a file next to this config:
# custom-css-file: custom.css
#
# Shared widget props work on every widget: title / title-url / hide-header /
# cache / css-class, plus `retries` (extra fetch attempts after the first,
# 0-10, default 3) and `show-errors` (false = fail quietly, keeping only the
# status dot by the title). Examples of both appear on the Lab page below.
#
# Glance type names still load: `to-do` is `todo`, `stocks` is `markets`.
pages:
  - name: Home
    slug: home
    hide-headers: true
    head-widgets:
      - type: search
        placeholder: Search the web or jump with a bang…
        search-engine:
          name: DuckDuckGo
          url: https://duckduckgo.com/?q={QUERY}
        bangs:
          - title: GitHub
            shortcut: gh
            url: https://github.com/search?q={QUERY}
          - title: Wikipedia
            shortcut: wiki
            url: https://en.wikipedia.org/wiki/Special:Search?search={QUERY}
    columns:
      - span: 3
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Singapore
                label: Singapore
              - timezone: America/New_York
                label: New York
              - timezone: America/Los_Angeles
                label: California
          - type: calendar
            first-day-of-week: monday
          - type: weather-radar
            title: Rain radar
            location: Singapore
            zoom: 7
          - type: events-calendar
            title: Holidays
            urls:
              - https://calendar.google.com/calendar/ical/en.singapore%23holiday%40group.v.calendar.google.com/public/basic.ics
            days: 30
            limit: 10
          - type: timer
            id: home-timer
            duration: 25m
            notes: true
      - span: 6
        widgets:
          - type: weather
            location: Singapore
            units: metric
          - type: rss
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
              - url: https://lobste.rs/rss
                title: Lobsters
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
      - span: 3
        widgets:
          - type: todo
            id: home-todo
          - type: monitor
            sites:
              - url: https://github.com
                title: GitHub
              - url: https://duckduckgo.com
                title: DuckDuckGo
              - url: https://example.com
                title: example.com
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: EURUSD=X
                name: EUR/USD
          - type: bookmarks
            groups:
              - title: Quick links
                links:
                  - title: GitHub
                    url: https://github.com
                  - title: selfh.st
                    url: https://selfh.st
                  - title: Hacker News
                    url: https://news.ycombinator.com
                  - title: Glance
                    url: https://github.com/glanceapp/glance
              - title: Tools
                links:
                  - title: DuckDuckGo
                    url: https://duckduckgo.com
                  - title: Notion
                    url: https://notion.so
          - type: notepad
            id: home-notes
            placeholder: Scratch notes…

  - name: Dev
    slug: dev
    hide-headers: true
    columns:
      - span: 4
        widgets:
          - type: custom-api
            url: https://api.github.com/repos/glanceapp/glance
            options:
              path: $.stargazers_count
              title: Stargazers
              description: github.com/glanceapp/glance
          # No top-level `url` when you want several endpoints in one widget:
          # subrequests fan out in parallel and become a synthetic root keyed
          # by name, so `path` reaches them as $.<name>.<field> (glance's
          # .Subrequest equivalent). With a top-level `url` set, that payload is
          # the root and subrequests are not merged in. Every other option is
          # resolved against whatever `path` selected, so two endpoints in one
          # list means one `path` that spans them.
          - type: custom-api
            title: Watched repos
            subrequests:
              glance: { url: https://api.github.com/repos/glanceapp/glance }
              bat: { url: https://api.github.com/repos/sharkdp/bat }
            options:
              path: $.*                 # one entry per subrequest
              title: $.name             # a leading $ or @ is JSONPath, else literal
              url: $.html_url
              value: $.stargazers_count
              icon: $.owner.avatar_url
          - type: releases
            repositories:
              - glanceapp/glance
              - sharkdp/bat
              - BurntSushi/ripgrep
            show-source-icon: true
            limit: 10
          - type: videos
            title: Tech — recent
            limit: 9
            style: grid-cards
            channels:
              - "@Fireship"
              - "@ByCloud"
              - "@BetterStack"
              - "@Bug-I"
              - "@CalebWritesCode"
              - "@AZisk"
      - span: 4
        widgets:
          - type: repository
            repository: glanceapp/glance
            pull-requests-limit: 5
            issues-limit: 5
            # Latest commits on the default branch. -1 is the default and means
            # "show none", which also skips the extra /commits request.
            commits-limit: 5
          - type: github-trending
            title: Trending
            language: typescript
            since: weekly
            limit: 10
          - type: contribution-graph
            title: Contributions
            username: glanceapp
      - span: 4
        widgets:
          - type: markets
            markets:
              - symbol: AAPL
                name: Apple
              - symbol: NVDA
                name: NVIDIA
              - symbol: TSLA
                name: Tesla
              - symbol: MSFT
                name: Microsoft
          - type: weather
            location: Singapore
            units: metric
          - type: group
            widgets:
              - type: todo
                id: dev-todo
              - type: iframe
                source: https://example.com
                height: 360
          - type: ai-quota
            title: Codex quota
            # One widget per provider. Credentials never live in this file —
            # the server hands the whole config to the browser, so a token
            # here would leak. Export the provider's env var instead, or set
            # `tokenFile` to a mounted credential path.
            provider: codex
            cache: 2m
          - type: model-endpoints
            title: Model endpoints
            # Which OpenRouter slugs this dashboard actually depends on — the
            # catalogue is 458, so the list IS the filter. `provider` narrows
            # every listed model to one tag, `unhealthy-only` is the "is a
            # model I rely on degraded?" view. No key: the API is public.
            models:
              - anthropic/claude-sonnet-4.5
              - openai/gpt-5
              - google/gemini-2.5-pro
            limit: 6
          - type: split-column
            # N children laid out one per grid track, `max-columns` per row
            # (>= 2, default 2). The third child here would wrap onto a second
            # row at the default; the cap below is what keeps all three level.
            max-columns: 3
            widgets:
              - type: todo
                id: dev-split-todo
              - type: html
                source: "<p>Side notes render here.</p>"
              - type: notepad
                id: dev-split-notes
                placeholder: Scratch…

  - name: Social
    slug: social
    hide-headers: true
    tiling: collage
    columns:
      - span: 4
        widgets:
          - type: videos
            title: Tech creators
            limit: 6
            style: vertical-list
            channels:
              - "@Fireship"
              - "@ByCloud"
              - "@BetterStack"
          - type: reddit
            subreddit: selfhosted
            limit: 8
            collapse-after: 5
            show-thumbnails: true
            show-flairs: true
            source-header: true
          - type: lobsters
            limit: 8
            sort-by: hot
            collapse-after: 5
            source-header: true
      - span: 8
        widgets:
          - type: videos
            title: Minecraft
            limit: 9
            style: grid-cards
            channels:
              - "@wemmbumc"
              - "@ParrotX2"
              - "@FlameFrags"
              - "@SpokeIsHere"
              - "@Evourai"
              - "@Minotaurmc"
              - "@TheNamesSX"
          - type: todo
            id: social-todo
          - type: bookmarks
            groups:
              - title: Social
                links:
                  - title: Reddit
                    url: https://reddit.com
                  - title: Lobsters
                    url: https://lobste.rs
                  - title: Twitch
                    url: https://twitch.tv
  - name: Lab
    slug: lab
    hide-headers: true
    # Homelab showcase — 3/6/3: the service rail, the main stage, then
    # community + releases. New homelab widgets (server-stats / dns-stats /
    # docker-containers) live in the left rail.
    columns:
      - span: 3
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: server-stats
            title: Servers
            servers:
              - type: local
                name: Glimpse
          - type: dns-stats
            title: Pi-hole
            service: pihole
            url: http://pihole.lab
            hide-graph: false
            hide-top-domains: false
          # Both widgets below need a credential and fall back to an env var
          # when it is not in the config (TS_API_KEY, HA_TOKEN), so they
          # report the fetch error until you set one — same as the media stack
          # on the Media page.
          - type: home-assistant
            title: Home Assistant
            url: http://home.lab:8123
            # One GET /api/states serves the whole list, filtered server-side.
            # An entry is a bare entity id, or `entity` + the `label` to show.
            entities:
              - light.hallway
              - entity: switch.living_room_fan
                label: Fan
              - sensor.living_room_temperature
          - type: tailscale
            title: Tailnet
            # `tailnet: -` means "whichever tailnet owns this key"; the key
            # needs the devices:core:read scope. Online devices sort first.
            limit: 12
          - type: docker-containers
            title: Containers
            sock-path: /var/run/docker.sock
            running-only: true
            hide-by-default: false
          - type: system-stats
            title: Host
          - type: network
            title: Network
            ping-target: 1.1.1.1
            public-ip: true
          - type: change-detection
            title: Watched pages
            urls:
              - https://example.com/prices
            selector: main
          # Twitch widgets need TWITCH_CLIENT_ID + TWITCH_CLIENT_SECRET in env
          # (Twitch app client-credentials flow; secrets stay server-side).
          - type: twitch-channels
            title: Live now
            channels:
              - shroud
              - xqc
            sort-by: viewers
            collapse-after: 5
          - type: twitch-top-games
            title: Top games
            limit: 10
            collapse-after: 5
            exclude:
              - just-chatting
              - music
          # The media stack lives on the Media page, against the same .lab
          # hosts — immich / jellyfin / qbittorrent / transmission.
          - type: todo
            id: lab-todo
      - span: 6
        widgets:
          - type: videos
            title: Homelab — recent
            limit: 8
            style: grid-cards
            channels:
              - "@TechnoTim"
              - "@CraftComputing"
              - "@NetworkChuck"
          - type: monitor
            title: Homelab — health
            # `retries` = extra fetch attempts after the first (0-10, default 3).
            # Self-hosted services behind a VPN are the canonical flaky case.
            retries: 4
            # External sources merge into the same site list (client unchanged):
            # Uptime Kuma pull source (public status page, no auth) and/or
            # Healthchecks push source (Management API v3; read-only key is
            # enough — pass it via ${HC_API_KEY} interpolation, optional
            # healthchecks-url defaults to https://healthchecks.io,
            # healthchecks-tags filters with repeated ?tag= params).
            # kuma-url: https://kuma.lab
            # kuma-slug: homelab
            # healthchecks-key: ${HC_API_KEY}
            # healthchecks-tags: [prod]
            # Per-site `icon:` takes an image URL or the same shorthand into a
            # public icon library as bookmarks: `si:` Simple Icons, `sh:`
            # selfh.st, `di:` Dashboard Icons, `mdi:` Material Design. A name
            # or URL that fails to load drops the icon, never the row.
            sites:
              - url: https://grafana.lab
                title: Grafana
                icon: si:grafana
              - url: https://immich.lab
                title: Immich
                icon: sh:immich
              - url: https://jellyfin.lab
                title: Jellyfin
                icon: si:jellyfin
              - url: https://home.lab
                title: Home Assistant
                icon: di:home-assistant
              - url: https://pihole.lab
                title: Pi-hole
                icon: si:pihole
              - url: https://portainer.lab
                title: Portainer
                icon: di:portainer
              - url: https://proxmox.lab
                title: Proxmox
                icon: si:proxmox
              - url: https://truenas.lab
                title: TrueNAS
                icon: mdi:nas
              - url: https://auth.lab
                title: Authentik
                icon: si:authentik
              - url: https://code.lab
                title: Gitea
                icon: si:gitea
          - type: rss
            title: Self-hosted blogs
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://blog.immich.app/rss.xml
                title: Immich
              - url: https://jellyfin.org/posts/rss.xml
                title: Jellyfin
              - url: https://www.home-assistant.io/atom.xml
                title: Home Assistant
              - url: https://blog.cloudflare.com/rss/
                title: Cloudflare Blog
              # `item-link-prefix` is per feed, and it is prepended verbatim to
              # every item link this feed emits — the fix for a feed that
              # publishes bare paths and leaves Glimpse to guess the origin.
              # It REPLACES the link, so never set it on a feed that already
              # publishes absolute ones. A dead feed only drops itself: the
              # widget still renders everything that did load.
              - url: http://miniflux.lab/feeds/unread.atom.xml
                title: Miniflux
                item-link-prefix: http://miniflux.lab/
          - type: hacker-news
            # A background feed: one attempt, and a rate-limit response must
            # not paint a red banner over the page. `show-errors: false` keeps
            # only the status dot by the title — quiet, never invisible.
            retries: 1
            show-errors: false
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
      - span: 3
        widgets:
          - type: reddit
            subreddit: homelab
            limit: 8
            collapse-after: 5
            show-thumbnails: true
            source-header: true
          - type: bookmarks
            # `icon:` takes an image URL, or a glance shorthand into a public
            # icon library: `si:` Simple Icons, `sh:` selfh.st, `di:`
            # Dashboard Icons, `mdi:` Material Design — `si:grafana` below. A
            # URL that fails to load drops the icon tile, never the link.
            groups:
              - title: Homelab
                links:
                  - title: Grafana
                    url: https://grafana.lab
                    icon: si:grafana
                  - title: Immich
                    url: https://immich.lab
                    icon: si:immich
                  - title: Home Assistant
                    url: https://home.lab
                    icon: si:homeassistant
                  - title: Jellyfin
                    url: https://jellyfin.lab
                    icon: si:jellyfin
                  - title: Pi-hole
                    url: https://pihole.lab
                    icon: si:pihole
              - title: Infra
                links:
                  - title: Proxmox
                    url: https://proxmox.lab
                  - title: Portainer
                    url: https://portainer.lab
                  - title: TrueNAS
                    url: https://truenas.lab
                  - title: Authentik
                    url: https://auth.lab
          - type: releases
            title: Homelab releases
            repositories:
              - immich-app/immich
              - home-assistant/core
              - jellyfin/jellyfin
              - grafana/grafana
            show-source-icon: true
            limit: 8
            collapse-after: 5
          - type: repository
            repository: home-assistant/core
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5
          - type: iframe
            title: Grafana
            source: https://grafana.lab/d/000000001/homelab?orgId=1&kiosk
            height: 420
          - type: weather
            location: Singapore
            units: metric

  - name: Media
    slug: media
    hide-headers: true
    # Media stack — every widget below points at a `.lab` host, so each one
    # renders an error banner until you point it at a real instance. The
    # credentials are left out on purpose: each widget falls back to its env
    # var (IMMICH_API_KEY, JELLYFIN_API_KEY, QBITTORRENT_USERNAME/PASSWORD,
    # TRANSMISSION_USERNAME/PASSWORD), so the file stays loadable with nothing
    # in the environment and secrets never sit in the config.
    columns:
      - span: 6
        widgets:
          - type: immich
            title: Recent photos
            url: https://immich.lab
            limit: 12
          - type: jellyfin
            title: Recently added
            url: https://jellyfin.lab
            # `user-id` is optional — /Items/Latest resolves the first user.
            limit: 12
          - type: bookmarks
            # `hide-arrow` and `target` are group- or link-level and the link
            # wins: `target` overrides `same-tab` and takes any target string,
            # so `_self` keeps a shortcut in the dashboard tab.
            groups:
              - title: Servers
                hide-arrow: true
                target: _self
                links:
                  - title: Immich
                    url: https://immich.lab
                    icon: si:immich
                  - title: Jellyfin
                    url: https://jellyfin.lab
                    icon: si:jellyfin
              - title: Torrents
                links:
                  - title: qBittorrent
                    url: http://qb.lab:8080
                    icon: si:qbittorrent
                  - title: Transmission
                    url: http://transmission.lab:9091
                    icon: si:transmission
      - span: 6
        widgets:
          - type: qbittorrent
            title: Downloads
            url: http://qb.lab:8080
            limit: 8
          - type: transmission
            title: Torrents
            url: http://transmission.lab:9091
            limit: 8
          - type: todo
            id: media-todo

# ai-quota (CodexBar port, 70 providers) — subscription % and reset countdowns.
# One live widget is on the Dev page; the id list is KNOWN_PROVIDERS in
# src/shared/widgets/quota-types.ts. Beyond `provider` and one of `token` /
# `tokenFile`, only a few take more:
#   projectId   openai, vertex — the console project that owns the quota
#   quotaUrl    gemini, vertex, grok, ollama, bedrock, antigravity — a
#               non-default or self-hosted endpoint (`ollama` is just
#               http://localhost:11434, `vertex` reads monitoring.googleapis.com)
#   tokenFile   jetbrains (AIAssistantQuotaManager2.xml), amp, kiro, grok,
#               opencode, zed — mount the CLI's own auth file rather than
#               copying a token out of it
# Give anything that shells out to a CLI (amp, kiro) a longer `cache`, 5m.
