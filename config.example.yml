# Glimpse showcase — flat glance-faithful demo (4 pages, hide-headers, Singapore).
# Copy to config.yml and edit. See README for full widget reference.
# Pages: Home (daily feeds) · Dev (releases / repos / videos) · Social (collage / reddit / twitch) · Lab (homelab).
# Flat style: 1px border / 5px radius / JetBrains Mono / no shadows — applied by the theme, not the config.
# videos: channels accept UC IDs (UC...) or @handles (e.g. @spokeishere, @Bug-I, @CalebWritesCode, @AZisk) — both work via resolveHandleToChannelId.
# Singapore weather repeated on Home/Dev/Lab for parity.
pages:
  - name: Home
    slug: home
    hide-headers: true
    # columns (default) keeps small at 300px — preferred-size for clock/weather/calendar
    # (previous collage+320 stretched small to ~500px). Social keeps collage as bento demo.
    head-widgets:
      - type: search
        placeholder: Search the web or jump with a bang…
        search-engine:
          name: DuckDuckGo
          url: https://duckduckgo.com/?q={QUERY}
        bangs:
          - title: GitHub
            shortcut: gh
            url: https://github.com/search?q={QUERY}
          - title: Wikipedia
            shortcut: wiki
            url: https://en.wikipedia.org/wiki/Special:Search?search={QUERY}
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Singapore
                label: Singapore
              - timezone: America/New_York
                label: New York
              - timezone: America/Los_Angeles
                label: California
          - type: weather
            location: Singapore
            units: metric
          - type: calendar
            first-day-of-week: monday
          - type: todo
            id: home-todo
      - size: full
        widgets:
          - type: rss
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
              - url: https://lobste.rs/rss
                title: Lobsters
          - type: monitor
            sites:
              - url: https://github.com
                title: GitHub
              - url: https://duckduckgo.com
                title: DuckDuckGo
              - url: https://example.com
                title: example.com
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
      - size: small
        widgets:
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: EURUSD=X
                name: EUR/USD
          - type: bookmarks
            groups:
              - title: Quick links
                links:
                  - title: GitHub
                    url: https://github.com
                  - title: selfh.st
                    url: https://selfh.st
                  - title: Hacker News
                    url: https://news.ycombinator.com
                  - title: Glance
                    url: https://github.com/glanceapp/glance
              - title: Tools
                links:
                  - title: DuckDuckGo
                    url: https://duckduckgo.com
                  - title: Notion
                    url: https://notion.so

  - name: Dev
    slug: dev
    hide-headers: true
    columns:
      - size: full
        widgets:
          - type: releases
            repositories:
              - glanceapp/glance
              - sharkdp/bat
              - BurntSushi/ripgrep
            show-source-icon: true
            limit: 10
          - type: videos
            title: Tech — recent
            limit: 9
            # style: horizontal-cards (1 row + overflow) | grid-cards (wrap) | vertical-list (rows) (default: horizontal-cards)
            # channels accepts either form — pick what you know:
            #   UC ID: "UCsBjURrPoezykLs9EqgamOA"  (stable, copy from channel URL)
            #   @handle: "@spokeishere" / "@Bug-I" / "@CalebWritesCode" / "@AZisk"  (easy, auto-resolved via youtube.com/@handle → UC)
            # Both resolve to the same YouTube RSS feed; mix freely. Bare handles ("spokeishere") also work (normalized to @handle).
            style: grid-cards
            channels:
              - UCsBjURrPoezykLs9EqgamOA  # Fireship — UC ID example
              - "@ByCloud"                # @handle example (same as UC6r0JH23PKZfogSwn2Q-oMw)
              - "@BetterStack"            # @handle example (same as UCkVfrGwV-iG9bSsgCbrNPxQ)
              - "@Bug-I"                  # https://www.youtube.com/@Bug-I → UCeUHo1UGx4p97AQllOYuneA
              - "@CalebWritesCode"        # https://www.youtube.com/@CalebWritesCode → UCuU9jE4MHHEIyYMbDfUPSew
              - "@AZisk"                  # https://www.youtube.com/@AZisk → UCajiMK_CY9icRhLepS8_3ug
              - UCkQS_dP6GJTmYnMlox-YiKQ  # @JiaBinHuang — UC ID also works
          - type: repository
            repository: glanceapp/glance
            pull-requests-limit: 5
            issues-limit: 5
      - size: small
        widgets:
          - type: custom-api
            url: https://api.github.com/repos/glanceapp/glance
            options:
              path: $.stargazers_count
              title: Stargazers
              description: github.com/glanceapp/glance
          - type: markets
            markets:
              - symbol: AAPL
                name: Apple
              - symbol: NVDA
                name: NVIDIA
              - symbol: TSLA
                name: Tesla
              - symbol: MSFT
                name: Microsoft
          - type: weather
            location: Singapore
            units: metric
          - type: group
            widgets:
              - type: todo
                id: dev-todo
              - type: iframe
                source: https://example.com
                height: 360

  - name: Social
    slug: social
    hide-headers: true
    tiling: collage
    min-column-width: 320
    columns:
      - size: full
        span: 2
        widgets:
          - type: split-column
            widgets:
              - type: videos
                title: Tech creators
                limit: 6
                # style: horizontal-cards (1 row + overflow) | grid-cards (wrap) | vertical-list (rows) (default: horizontal-cards)
                # channels: UC ID or @handle — e.g. "@spokeishere" also works
                style: vertical-list
                channels:
                  - UCsBjURrPoezykLs9EqgamOA  # Fireship (UC)
                  - "@ByCloud"                # @handle (same as UC6r0JH23PKZfogSwn2Q-oMw)
                  - "@BetterStack"            # @handle
              - type: videos
                title: Minecraft — Unstable Universe & friends
                limit: 9
                # style: horizontal-cards (1 row + overflow) | grid-cards (wrap) | vertical-list (rows) (default: horizontal-cards)
                # Mix UC and @handle freely — e.g. "@SpokeIsHere" ↔ UCK... ; handles with hyphens like @Bug-I also work
                style: grid-cards
                channels:
                  - UCGwHHBGD-1ysDvq1Z4xXw7g  # @UnstableUniverse (UC)
                  - UCPLMPHT-d8GZOqL_AHJFdQQ  # @ParrotX2
                  - UCkzzNLnuM-VsATWC53ehwOQ  # @Wemmbu (@wemmbumc)
                  - UCkvg04omHN08nuKdvKZoNuA  # @FlameFrags
                  - "@SpokeIsHere"            # @handle example — also works as UCk2uxbWi5py_iJXaEsh2YRA, try "@spokeishere" lower-case too
          - type: reddit
            subreddit: selfhosted
            limit: 10
            collapse-after: 5
            show-thumbnails: true
            show-flairs: true
            source-header: true
            # Reddit anonymous JSON now 403s; add one of:
            # app-auth: { id: "CLIENT_ID", secret: "CLIENT_SECRET" }  # POST https://www.reddit.com/api/v1/access_token then GET https://oauth.reddit.com
            # proxy: "https://user:pass@proxy.example.com:8080"
            # request-url-template: "https://proxy.local/{REQUEST-URL}"
          - type: lobsters
            limit: 8
            collapse-after: 5
            source-header: true
      - size: full
        widgets:
          - type: twitch-channels
            channels:
              - shroud
              - xqc
              - summit1g
            limit: 6
            collapse-after: 4
          - type: bookmarks
            groups:
              - title: Social
                links:
                  - title: Reddit
                    url: https://reddit.com
                  - title: Lobsters
                    url: https://lobste.rs
                  - title: Twitch
                    url: https://twitch.tv
          - type: todo
            id: social-todo

  - name: Lab
    slug: lab
    hide-headers: true
    # Homelab showcase — every required Lab widget in one page.
    # Columns stay `columns` (flex) so small = 300px fixed; Lab intentionally
    # repeats weather/calendar/todo/markets/bookmarks/videos/releases/monitor
    # so all four pages together exercise every element/usecase even repeated.
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: todo
            id: lab-todo
          - type: weather
            location: Singapore
            units: metric
          - type: bookmarks
            groups:
              - title: Homelab
                links:
                  - title: Grafana
                    url: https://grafana.lab
                    icon: si:grafana
                  - title: Immich
                    url: https://immich.lab
                    icon: si:immich
                  - title: Home Assistant
                    url: https://home.lab
                    icon: si:homeassistant
                  - title: Jellyfin
                    url: https://jellyfin.lab
                    icon: si:jellyfin
                  - title: Pi-hole
                    url: https://pihole.lab
                    icon: si:pihole
              - title: Infra
                links:
                  - title: Proxmox
                    url: https://proxmox.lab
                  - title: Portainer
                    url: https://portainer.lab
                  - title: TrueNAS
                    url: https://truenas.lab
                  - title: Authentik
                    url: https://auth.lab
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: ETH-USD
                name: Ethereum
              - symbol: NVDA
                name: NVIDIA
      - size: full
        widgets:
          - type: monitor
            title: Homelab — health
            sites:
              - url: https://grafana.lab
                title: Grafana
              - url: https://immich.lab
                title: Immich
              - url: https://jellyfin.lab
                title: Jellyfin
              - url: https://home.lab
                title: Home Assistant
              - url: https://pihole.lab
                title: Pi-hole
              - url: https://portainer.lab
                title: Portainer
              - url: https://proxmox.lab
                title: Proxmox
              - url: https://truenas.lab
                title: TrueNAS
              - url: https://auth.lab
                title: Authentik
              - url: https://code.lab
                title: Gitea
          - type: custom-api
            title: Homelab stats
            url: https://api.github.com/repos/home-assistant/core
            options:
              path: $.stargazers_count
              title: Home Assistant stars
              description: github.com/home-assistant/core — proxy for lab stats
          - type: rss
            title: Self-hosted blogs
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://blog.immich.app/rss.xml
                title: Immich
              - url: https://jellyfin.org/posts/rss.xml
                title: Jellyfin
              - url: https://www.home-assistant.io/atom.xml
                title: Home Assistant
              - url: https://blog.cloudflare.com/rss/
                title: Cloudflare Blog
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
          - type: reddit
            subreddit: homelab
            limit: 8
            collapse-after: 5
            show-thumbnails: true
            source-header: true
            # Reddit anonymous JSON now 403s; add one of:
            # app-auth: { id: "CLIENT_ID", secret: "CLIENT_SECRET" }
            # proxy: "https://user:pass@proxy.example.com:8080"
      - size: small
        widgets:
          - type: videos
            title: Homelab — recent
            limit: 8
            style: grid-cards
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw  # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg  # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA  # Fireship — UC ID, data-driven
              - UCBJycsmduvYEL83R_U4JriQ  # Marques Brownlee (placeholder homelab-adjacent)
          - type: releases
            title: Homelab releases
            repositories:
              - immich-app/immich
              - home-assistant/core
              - jellyfin/jellyfin
              - grafana/grafana
            show-source-icon: true
            limit: 8
            collapse-after: 5
          - type: repository
            repository: home-assistant/core
            pull-requests-limit: 5
            issues-limit: 5
          - type: twitch-channels
            title: Lab streams
            channels:
              - shroud
              - theprimeagen
              - j_blow
            limit: 6
            collapse-after: 4
          - type: iframe
            title: Grafana
            source: https://grafana.lab/d/000000001/homelab?orgId=1&kiosk
            height: 420
