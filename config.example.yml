# Glimpse showcase — flat glance-faithful demo (3 pages, hide-headers, Singapore).
# Copy to config.yml and edit. See README for full widget reference.

pages:
  - name: Home
    slug: home
    hide-headers: true
    # columns (default) keeps small at 300px — preferred-size for clock/weather/calendar
    # (previous collage+320 stretched small to ~500px). Social keeps collage as bento demo.
    head-widgets:
      - type: search
        placeholder: Search the web or jump with a bang…
        search-engine:
          name: DuckDuckGo
          url: https://duckduckgo.com/?q={QUERY}
        bangs:
          - title: GitHub
            shortcut: gh
            url: https://github.com/search?q={QUERY}
          - title: Wikipedia
            shortcut: wiki
            url: https://en.wikipedia.org/wiki/Special:Search?search={QUERY}
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Singapore
                label: Singapore
              - timezone: America/New_York
                label: New York
              - timezone: Europe/London
                label: London
          - type: weather
            location: Singapore
            units: metric
          - type: calendar
            first-day-of-week: monday
          - type: todo
            id: home-todo
      - size: full
        widgets:
          - type: rss
            limit: 10
            collapse-after: 5
            source-header: true
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
              - url: https://lobste.rs/rss
                title: Lobsters
          - type: monitor
            sites:
              - url: https://github.com
                title: GitHub
              - url: https://duckduckgo.com
                title: DuckDuckGo
              - url: https://example.com
                title: example.com
          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5
            source-header: true
      - size: small
        widgets:
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: EURUSD=X
                name: EUR/USD
          - type: bookmarks
            groups:
              - title: Quick links
                links:
                  - title: GitHub
                    url: https://github.com
                  - title: selfh.st
                    url: https://selfh.st
                  - title: Hacker News
                    url: https://news.ycombinator.com
                  - title: Glance
                    url: https://github.com/glanceapp/glance
              - title: Tools
                links:
                  - title: DuckDuckGo
                    url: https://duckduckgo.com
                  - title: Notion
                    url: https://notion.so

  - name: Dev
    slug: dev
    hide-headers: true
    columns:
      - size: full
        widgets:
          - type: releases
            repositories:
              - glanceapp/glance
              - sharkdp/bat
              - BurntSushi/ripgrep
            show-source-icon: true
            limit: 10
          - type: videos
            title: Tech — recent
            limit: 9
            # style: horizontal-cards | vertical-list | grid-cards (default: horizontal-cards)
            style: grid-cards
            channels:
              - UCsBjURrPoezykLs9EqgamOA  # Fireship
              - UC6r0JH23PKZfogSwn2Q-oMw  # @ByCloud
              - UCkVfrGwV-iG9bSsgCbrNPxQ  # @BetterStack
              - UCQx_JXdo1Ug5GYmvJ6tgHIw  # @CalebCurry
              - UCwpXw5c2M9Ry4odACXsebdA  # @bugsnag / Bugsnag
              - UCkQS_dP6GJTmYnMlox-YiKQ  # @JiaBinHuang
          - type: repository
            repository: glanceapp/glance
            pull-requests-limit: 5
            issues-limit: 5
      - size: small
        widgets:
          - type: custom-api
            url: https://api.github.com/repos/glanceapp/glance
            options:
              path: $.stargazers_count
              title: Stargazers
              description: github.com/glanceapp/glance
          - type: markets
            markets:
              - symbol: AAPL
                name: Apple
              - symbol: NVDA
                name: NVIDIA
              - symbol: TSLA
                name: Tesla
              - symbol: MSFT
                name: Microsoft
          - type: weather
            location: Singapore
            units: metric
          - type: group
            widgets:
              - type: todo
                id: dev-todo
              - type: iframe
                source: https://example.com
                height: 360

  - name: Social
    slug: social
    hide-headers: true
    tiling: collage
    min-column-width: 320
    columns:
      - size: full
        span: 2
        widgets:
          - type: split-column
            widgets:
              - type: videos
                title: Tech creators
                limit: 6
                # style: horizontal-cards | vertical-list | grid-cards (default: horizontal-cards)
                style: vertical-list
                channels:
                  - UCsBjURrPoezykLs9EqgamOA  # Fireship
                  - UC6r0JH23PKZfogSwn2Q-oMw  # @ByCloud
                  - UCkVfrGwV-iG9bSsgCbrNPxQ  # @BetterStack
              - type: videos
                title: Minecraft — Unstable Universe & friends
                limit: 9
                # style: horizontal-cards | vertical-list | grid-cards (default: horizontal-cards)
                style: grid-cards
                channels:
                  - UCGwHHBGD-1ysDvq1Z4xXw7g  # @UnstableUniverse
                  - UCPLMPHT-d8GZOqL_AHJFdQQ  # @ParrotX2
                  - UCkzzNLnuM-VsATWC53ehwOQ  # @Wemmbu (@wemmbumc)
                  - UCkvg04omHN08nuKdvKZoNuA  # @FlameFrags
                  - UCk2uxbWi5py_iJXaEsh2YRA  # @SpokeIsHere
          - type: reddit
            subreddit: selfhosted
            limit: 10
            collapse-after: 5
            show-thumbnails: true
            show-flairs: true
            source-header: true
          - type: lobsters
            limit: 8
            collapse-after: 5
            source-header: true
      - size: full
        widgets:
          - type: twitch-channels
            channels:
              - shroud
              - xqc
              - summit1g
            limit: 6
            collapse-after: 4
          - type: bookmarks
            groups:
              - title: Social
                links:
                  - title: Reddit
                    url: https://reddit.com
                  - title: Lobsters
                    url: https://lobste.rs
                  - title: Twitch
                    url: https://twitch.tv
          - type: todo
            id: social-todo
